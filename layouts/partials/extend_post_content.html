{{- if .Site.Params.related.enabled | default true }}
  {{- $related := .Site.RegularPages.Related . | first 5 }}
  {{- with $related }}
    <div class="related-posts">
      <h3>نوشته‌های مرتبط</h3>
      <ul>
        {{- range . }}
          <li>
            <a href="{{ .Permalink }}">{{ .Title }}</a>
          </li>
        {{- end }}
      </ul>
    </div>
  {{- end }}
{{- end }}
